<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="pasos">
                <p><span class="paso-numero active">1</span> Informacion Personal</p>
                <p><span class="paso-numero ">2</span> Planes</p>
                <p><span class="paso-numero ">3</span> Datos Bancarios</p>
                <p><span class="paso-numero ">4</span> Resumen</p>
            </div>
        </aside>

        <main class="content">
            <div class="creditCardForm">
                <div class="heading">
                    <h1>Datos Bancarios</h1>
                </div>
                <div class="pago">
                    <form>
                        <div class="form-group owner">
                            <label for="owner">Propietario</label>
                            <input type="text" class="form-control" id="owner">
                        </div>
                        
                        <div class="form-group">
                            <label for="cardNumber">Número de Tarjeta</label>
                            <input type="text" class="form-control" id="cardNumber">
                        </div>

                        <div class="form-group expiration-date">
                            <label>Fecha de Expiración</label>
                            <div class="expiration-container">
                                <select>
                                    <option value="01">Enero</option>
                                    <option value="02">Febrero</option>
                                    <option value="03">Marzo</option>
                                    <option value="04">Abril</option>
                                    <option value="05">Mayo</option>
                                    <option value="06">Junio</option>
                                    <option value="07">Julio</option>
                                    <option value="08">Agosto</option>
                                    <option value="09">Septiembre</option>
                                    <option value="10">Octubre</option>
                                    <option value="11">Noviembre</option>
                                    <option value="12">Diciembre</option>
                                </select>
                                <select>
                                    <option value="2025">2025</option>
                                    <option value="2026">2026</option>
                                    <option value="2024">2024</option>
                                    <option value="2025">2025</option>
                                    <option value="2026">2026</option>
                                    <option value="2027">2027</option>
                                    <option value="2028">2028</option>
                                    <option value="2029">2029</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group cvv">
                            <label for="cvv">CVV</label>
                            <input type="number" class="form-control" id="cvv">
                        </div>
                        <div class="form-group pay-now">
                            <button type="submit" class="confirm-btn">Confirmar Pago</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
