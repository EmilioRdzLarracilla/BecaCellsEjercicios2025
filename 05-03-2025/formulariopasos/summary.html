<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen</title>
    <link rel="stylesheet" href="style4.css"> 
</head>
<body>
    <div class="container">
       
        <aside class="sidebar">
            <div class="pasos">
                <p><span class="paso-numero active">1</span> Informacion Personal</p>
                <p><span class="paso-numero ">2</span> Planes</p>
                <p><span class="paso-numero ">3</span> Datos Bancarios</p>
                <p><span class="paso-numero ">4</span> Resumen</p>
            </div>
        </aside>


      
        <main class="content">
            <h2>Resumen de tu Selección</h2>
            <p>Aquí verás un resumen de los datos que has ingresado y el plan que has seleccionado.</p>

            <div class="summary-box">
                <p><strong>Nombre:</strong> [Tu Nombre]</p>
                <p><strong>Email:</strong> [Tu Email]</p>
                <p><strong>Dirección:</strong> [Tu Dirección]</p>
                <p><strong>Plan Seleccionado:</strong> [Nombre del Plan]</p>
                <p><strong>Precio:</strong> [Monto]</p>
            </div>

            <button class="confirm-btn">Confirmar</button>
        </main>
    </div>
</body>
</html>
