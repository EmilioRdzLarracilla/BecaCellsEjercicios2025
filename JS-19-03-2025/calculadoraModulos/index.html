<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora (Modulos)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="calculadora">
        <section class="pantalla">0</section>
        <button id="c" class="btn" data-value="C">C</button>
        <button id="borrar" class="btn" data-value="←">←</button>
        <button class="btn" data-value="/">/</button>
        <button class="btn" data-value="*">*</button>
        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn" data-value="-">-</button>
        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn" data-value="+">+</button>
        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn" data-value="%">%</button>
        <button class="btn" data-value=".">.</button>
        <button id="cero" class="btn" data-value="0">0</button>
        <button class="btn" data-value="^">^</button>
        <button id="igual" class="btn" data-value="=">=</button>
    </section>
    <script type="module" src="./main.js"></script>
</body>
</html>
