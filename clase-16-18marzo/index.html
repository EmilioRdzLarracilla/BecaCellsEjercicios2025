<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>objetos globales</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>objetos globales en js</h1>
    <div class="contenedor">contenido</div>
    <article id="article">article with content</article>

    <span class="span"></span><span class="span"></span
    ><span class="span"></span><span class="span"></span
    ><span class="span"></span><span class="span"></span
    ><span class="span"></span><span class="span"></span
    ><span class="span"></span><span class="span"></span
    ><span class="span"></span><span class="span"></span>

    <ul class="ul">
      <li>uno</li>
      <li>dos</li>
      <li>tres</li>
      <li>cuatro</li>
    </ul>

    <h3>hola</h3>
    <section id="seccion"></section>

    <figure>
      <img
        src="https://img.freepik.com/psd-gratis/arbol-verde-exuberante-colina-hierba-naturaleza-belleza-primavera_84443-40026.jpg"
        alt="arbol"
      />
      <figcaption>arboles</figcaption>
    </figure>

    <form>
      <input
        data-description="input modificado"
        class="inputText"
        type="text"
        name="nombre"
        placeholder="nombre"
      />
      <input type="number" name="edad" />
    </form>
  </body>
