<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>calculadora</h1>
    <main class="calc-container">
      <section class="calc-display">
        <article class="calc-expresion"></article>
        <article class="calc-result"></article>
      </section>
      <section class="calc-buttons">
        <button class="calc-btn" data-value="&larr" data-action="backspace">
          <p>&#8592</p>
        </button>
        <button class="calc-btn" data-value="%" data-action="percenage">
          %
        </button>
        <button class="calc-btn" data-value="+/-" data-action="negative">
          +/-
        </button>
        <button class="calc-btn" data-value="clear" data-action="clear">
          borrar
        </button>
        <button class="calc-btn" data-value="7" data-action="number">7</button>
        <button class="calc-btn" data-value="8" data-action="number">8</button>
        <button class="calc-btn" data-value="9" data-action="number">9</button>
        <button class="calc-btn" data-value="/" data-action="division">
          /
        </button>
        <button class="calc-btn" data-value="4" data-action="number">4</button>
        <button class="calc-btn" data-value="5" data-action="number">5</button>
        <button class="calc-btn" data-value="6" data-action="number">6</button>
        <button class="calc-btn" data-value="x" data-action="multiplication">
          x
        </button>
        <button class="calc-btn" data-value="1" data-action="number">1</button>
        <button class="calc-btn" data-value="2" data-action="number">2</button>
        <button class="calc-btn" data-value="3" data-action="number">3</button>
        <button class="calc-btn" data-value="-" data-action="substraction">
          -
        </button>
        <button class="calc-btn" data-value="0" data-action="number">0</button>
        <button class="calc-btn" data-value="." data-action="number">.</button>
        <button class="calc-btn" data-value="=" data-action="submit">=</button>
        <button class="calc-btn" data-value="+" data-action="addition">
          +
        </button>
      </section>
    </main>
  </body>
  <script src="main.js"></script>
</html>
