<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Jump</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: #000000;
            padding: 10px;
            position: absolute;
        }
        .container {
            display: flex;
            flex-direction: row-reverse; /*column-reverse*/
        }

        .container * {
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <section class="container">
        <article>A</article>
        <article>B</article>
        <article>C</article>
        <article>D</article>
    </section>

</body>
</html>
